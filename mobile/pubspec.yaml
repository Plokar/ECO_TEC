name: ecoquest
description: "EcoQuest — turn real-world environmental action into a social game."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  camera: ^0.12.0+2
  cloud_firestore: ^6.8.0
  firebase_auth: ^6.5.7
  firebase_core: ^4.13.0
  firebase_storage: ^13.4.6
  flutter:
    sdk: flutter
  flutter_map: ^8.3.1
  geolocator: ^14.0.3
  google_fonts: ^8.2.1
  image: ^4.9.1
  intl: ^0.20.3
  latlong2: ^0.10.1
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/brand/
