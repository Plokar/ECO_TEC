org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# tflite_flutter 0.12.1 pins its Android module to Java 11 and declares no Kotlin
# JVM target, so Kotlin falls back to the toolchain's 21 and Gradle fails the
# build on the mismatch. Downgrading that check to a warning is safe here because
# D8/R8 dexes every module anyway, so mixed class-file versions never reach a
# device. The validation exists for pure-JVM libraries, which this is not.
#
# ponytail: the alternative is forcing sourceCompatibility on every subproject
# from the root build file, which also overrides the Firebase modules. Drop this
# line if tflite_flutter ever ships a matching jvmTarget.
kotlin.jvm.target.validation.mode=warning
